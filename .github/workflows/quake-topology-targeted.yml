name: Quake Topology Targeted Check

on:
  push:
    branches:
      - investigate/quake-topology-triangle

jobs:
  quake-topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev zlib1g-dev
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: rust-build
      - name: Run triangle topology regression test
        run: cargo test --locked -p quake --no-default-features triangle_topology_is_connected -- --nocapture
